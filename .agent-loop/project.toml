schema_version = 1

[approval]
mode = "github_branch"
remote = "origin"
base_branch = "main"

[bootstrap]
command = ["bash", "scripts/agent-loop/bootstrap.sh"]
timeout_seconds = 300

[executor]
timeout_seconds = 1800
heartbeat_seconds = 30

[reviewer]
timeout_seconds = 1800
heartbeat_seconds = 30

[environment]
required = []

[validation]
commands = [
  ["python3", "scripts/private-fixtures/validate-gate.py"],
  ["bash", "scripts/agent-loop/test.sh"],
  ["git", "diff", "--check"],
]

[instructions]
executor = [".agent-loop/executor.md"]
reviewer = [".agent-loop/reviewer.md"]

[documentation]
required = true
required_paths = [
  "docs/tasks/{task_id}.md",
  "ROADMAP.md",
  "README.md",
]

[limits]
output_bytes = 16777216
file_bytes = 67108864
memory_bytes = 4294967296
tasks = 512
run_files = 512

[policy]
missing_profile = "deny"
terminate_grace_seconds = 5
