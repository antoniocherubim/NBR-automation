name: Validate and Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify Python version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys

          if sys.version_info < (3, 12):
              raise SystemExit(
                  f"ERROR: Python >= 3.12 obrigatório; encontrado {sys.version.split()[0]}"
              )
          print(f"Python OK: {sys.version.split()[0]}")
          PY

      - name: Run validation gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/private-fixtures/validate-gate.py
          python3 -m compileall -q src tests scripts/private-fixtures scripts/ci
          PYTHONPATH=src:scripts/private-fixtures python3 -m unittest discover -s tests -p 'test_*.py'
          git diff --check
          python3 scripts/ci/validate-public-tree.py --commit "$GITHUB_SHA"
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "ERROR: working tree não está limpo após os gates" >&2
            git status --short --untracked-files=all
            exit 1
          fi

      - name: Create artifact.zip from commit
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=artifact.zip "$GITHUB_SHA"

      - name: Validate artifact.zip structure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/validate-artifact-zip.py artifact.zip "$GITHUB_SHA"

      - name: Compute artifact size and SHA-256
        id: artifact_meta
        shell: bash
        run: |
          set -euo pipefail
          size="$(stat -c%s artifact.zip)"
          sha256="$(sha256sum artifact.zip | awk '{print $1}')"
          echo "size=${size}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "artifact.zip: ${size} bytes"
          echo "artifact.zip SHA-256: ${sha256}"

      - name: Upload artifact.zip
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: artifact.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Write job summary
        if: success()
        shell: bash
        env:
          ARTIFACT_SIZE: ${{ steps.artifact_meta.outputs.size }}
          ARTIFACT_SHA256: ${{ steps.artifact_meta.outputs.sha256 }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          {
            echo "## Validate and Package"
            echo ""
            echo "| Campo | Valor |"
            echo "|-------|-------|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Gates | validate-gate, compileall, unittest, \`git diff --check\`, validate-public-tree — OK |"
            echo "| Tamanho \`artifact.zip\` | ${ARTIFACT_SIZE} bytes |"
            echo "| SHA-256 local | \`${ARTIFACT_SHA256}\` |"
            if [[ -n "${ARTIFACT_ID:-}" ]]; then
              echo "| Artifact ID | ${ARTIFACT_ID} |"
            fi
            if [[ -n "${ARTIFACT_URL:-}" ]]; then
              echo "| Artifact URL | ${ARTIFACT_URL} |"
            fi
            if [[ -n "${ARTIFACT_DIGEST:-}" ]]; then
              echo "| Artifact digest | \`${ARTIFACT_DIGEST}\` |"
            fi
            echo ""
            echo "**Conteúdo:** o pacote contém somente a árvore Git sanitizada (inventários, código, testes e docs). Não inclui bytes de norma, template ou plantas."
            echo "**Histórico:** este artifact não sanitiza o histórico Git; OPR-PUBLIC-001 permanece obrigatório antes de publicação."
            echo "**Retenção:** 7 dias. Quem possui acesso de leitura ao repositório privado pode baixar o artifact enquanto existir."
          } >> "$GITHUB_STEP_SUMMARY"
